name: 'asset_correlation_redshift'
version: '1.0.0'

flags:
  indirect_selection: cautious

profile: 'asset_correlation_redshift'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  asset_correlation_redshift:
    marts:
      +materialized: table
      +schema: marts
      +sort: price_date
      +dist: price_date

      fct_assets:
        +materialized: incremental
      
      dim_dates:
        +dist: all
